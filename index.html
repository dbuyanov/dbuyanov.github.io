<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yan | Aucta AI — Automation Agency</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04080f;--surface:#0b1220;--surface2:#111c30;
  --border:rgba(99,179,255,0.12);--blue:#3b82f6;--blue-bright:#60a5fa;
  --blue-glow:rgba(59,130,246,0.35);--cyan:#22d3ee;--purple:#a78bfa;
  --text:#e8f0fe;--muted:#7a90b0;--accent:#f59e0b;--green:#10b981;
  --radius:20px;--fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--text);overflow-x:hidden}
h1,h2,h3,h4,h5,p,span,div,button,a{overflow-wrap:break-word;word-break:break-word}

/* CANVAS */
#cvs{position:fixed;inset:0;z-index:0;pointer-events:none}
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.022}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;animation:orbF 18s ease-in-out infinite}
.o1{width:700px;height:700px;top:-200px;left:-150px;background:radial-gradient(circle,rgba(59,130,246,.18),transparent 70%)}
.o2{width:500px;height:500px;bottom:5%;right:-100px;background:radial-gradient(circle,rgba(34,211,238,.12),transparent 70%);animation-delay:-7s}
.o3{width:400px;height:400px;top:40%;left:35%;background:radial-gradient(circle,rgba(167,139,250,.08),transparent 70%);animation-delay:-13s}
.o4{width:300px;height:300px;top:70%;left:60%;background:radial-gradient(circle,rgba(245,158,11,.06),transparent 70%);animation-delay:-5s}
@keyframes orbF{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.06)}66%{transform:translate(-30px,35px) scale(.94)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--blue),var(--purple));border-radius:10px}
.wrapper{position:relative;z-index:2}
.container{max-width:1280px;margin:0 auto;padding:0 1.5rem}

/* LANG */
.lang-toggle{position:fixed;top:24px;right:24px;z-index:1000;display:flex;gap:4px;
  background:rgba(11,18,32,.92);backdrop-filter:blur(20px);border:1px solid var(--border);
  border-radius:50px;padding:5px;box-shadow:0 0 30px rgba(59,130,246,.1)}
.lang-option{padding:6px 14px;border-radius:40px;font-family:var(--fd);font-size:.78rem;font-weight:700;
  cursor:pointer;transition:all .25s;color:var(--muted);user-select:none}
.lang-option.active{background:var(--blue);color:#fff;box-shadow:0 0 15px var(--blue-glow)}
.lang-option:not(.active):hover{color:var(--text)}

/* HERO */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:6rem 1.5rem 4rem;position:relative;overflow:hidden}
.hf{position:absolute;pointer-events:none;animation:hfloat 6s ease-in-out infinite}
.hf:nth-child(1){top:15%;left:8%}.hf:nth-child(2){top:22%;right:9%;animation-delay:-2s}
.hf:nth-child(3){bottom:28%;left:11%;animation-delay:-4s}.hf:nth-child(4){bottom:22%;right:7%;animation-delay:-1s}
.chip{background:rgba(11,18,32,.85);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:50px;padding:7px 15px;font-size:.78rem;font-weight:600;color:var(--blue-bright);
  white-space:nowrap;box-shadow:0 4px 20px rgba(59,130,246,.1);display:flex;align-items:center;gap:7px}
@keyframes hfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(1deg)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.3);border-radius:50px;padding:8px 20px;
  font-family:var(--fd);font-size:.78rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--blue-bright);margin-bottom:2rem;animation:fsup .8s ease-out both}
.edot{width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.htitle{font-family:var(--fd);font-size:clamp(2.6rem,7vw,5.8rem);font-weight:800;
  line-height:1.06;letter-spacing:-.02em;margin-bottom:1.8rem;animation:fsup .8s .15s ease-out both}
.htitle .line{display:block}
.gt{background:linear-gradient(135deg,#60a5fa 0%,#22d3ee 40%,#a78bfa 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.gt::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#3b82f6,#22d3ee,transparent);border-radius:2px}
.hsub{max-width:660px;font-size:1.12rem;line-height:1.68;color:#8fa8c8;
  margin-bottom:3rem;animation:fsup .8s .3s ease-out both}
.hsub strong{color:var(--text)}
.hbtns{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;animation:fsup .8s .45s ease-out both}
.btnp{background:linear-gradient(135deg,var(--blue),#5b21b6);color:#fff;border:none;
  padding:1rem 2.2rem;border-radius:50px;font-family:var(--fd);font-size:.95rem;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:all .3s;
  position:relative;overflow:hidden;box-shadow:0 0 40px rgba(59,130,246,.35)}
.btnp::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent);opacity:0;transition:.3s}
.btnp:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 50px rgba(59,130,246,.5)}
.btnp:hover::before{opacity:1}
.btns{background:transparent;color:var(--text);border:1px solid var(--border);
  padding:1rem 2.2rem;border-radius:50px;font-family:var(--fd);font-size:.95rem;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .3s}
.btns:hover{border-color:var(--blue);color:var(--blue-bright);transform:translateY(-3px)}

/* STATS */
.sbar{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin:4rem 0 2rem;animation:fsup .8s .6s ease-out both}
.si{flex:1;min-width:150px;padding:1.8rem 1.2rem;text-align:center;
  border-right:1px solid var(--border);position:relative;overflow:hidden;transition:background .3s}
.si:last-child{border-right:none}
.si:hover{background:var(--surface2)}
.si::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),transparent);
  transform:scaleX(0);transition:.4s}
.si:hover::before{transform:scaleX(1)}
.snum{font-family:var(--fd);font-size:2.3rem;font-weight:800;
  background:linear-gradient(135deg,var(--blue-bright),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.slbl{font-size:.78rem;color:var(--muted);margin-top:.4rem;letter-spacing:.05em}

/* TICKER */
.tkw{overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.85rem 0;margin-bottom:2rem}
.tki{display:flex;gap:3rem;white-space:nowrap;animation:tk 28s linear infinite}
.tki:hover{animation-play-state:paused}
.tkt{font-family:var(--fd);font-size:.8rem;font-weight:700;letter-spacing:.08em;
  color:var(--muted);display:flex;align-items:center;gap:9px}
.tkd{width:5px;height:5px;border-radius:50%;background:var(--blue)}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes fsup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* SECTION */
.slabel{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-size:.72rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:.9rem}
.slabel::before{content:'';width:22px;height:1px;background:var(--blue)}
.stitle{font-family:var(--fd);font-size:clamp(1.8rem,4vw,3rem);font-weight:800;line-height:1.15;margin-bottom:.9rem}
.sdesc{color:var(--muted);font-size:1rem;line-height:1.65}

/* SHOP */
.shop-s{padding:3.5rem 0 5rem}
.shop-hd{text-align:center;margin-bottom:3.5rem}

/* DEAL BANNER */
.deal-banner{display:flex;align-items:flex-start;gap:16px;
  background:linear-gradient(135deg,rgba(245,158,11,.13),rgba(239,68,68,.06));
  border:1px solid rgba(245,158,11,.4);border-radius:20px;padding:1.5rem 2rem;
  margin:2rem auto 0;max-width:800px;text-align:left;position:relative;overflow:hidden}
.deal-banner::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(245,158,11,.07),transparent);
  animation:shim 3s ease-in-out infinite;pointer-events:none}
@keyframes shim{0%,100%{opacity:0}50%{opacity:1}}
.deal-ico{font-size:2rem;flex-shrink:0;color:var(--accent);animation:fp 2s ease-in-out infinite}
@keyframes fp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.deal-txt strong{display:block;font-family:var(--fd);font-size:1rem;font-weight:800;color:var(--accent);margin-bottom:.4rem}
.deal-txt p{color:#d4a84b;font-size:.9rem;line-height:1.65;position:relative;z-index:1}

/* PRODUCT GRID — strict 3 cols */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem}

/* PRODUCT CARD */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:22px;
  overflow:hidden;transition:all .4s cubic-bezier(.175,.885,.32,1.275);
  cursor:pointer;position:relative;display:flex;flex-direction:column}
.pcard::after{content:'';position:absolute;inset:0;border-radius:22px;
  background:linear-gradient(135deg,rgba(59,130,246,.05),rgba(167,139,250,.05));
  opacity:0;transition:.4s;pointer-events:none}
.pcard:hover{transform:translateY(-10px) scale(1.015);
  border-color:rgba(99,179,255,.4);
  box-shadow:0 28px 55px rgba(0,0,0,.4),0 0 35px rgba(59,130,246,.1)}
.pcard:hover::after{opacity:1}

/* CARD MEDIA */
.cmedia{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface2)}
.cmedia img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;display:block}
.pcard:hover .cmedia img{transform:scale(1.06)}
.cmov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(4,8,15,.96))}
.cnum{position:absolute;top:.9rem;left:.9rem;
  width:34px;height:34px;border-radius:10px;
  background:rgba(4,8,15,.8);backdrop-filter:blur(10px);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:.68rem;font-weight:800;color:var(--muted)}
.ccat{position:absolute;top:.9rem;right:.9rem;
  background:rgba(11,18,32,.9);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:40px;padding:3px 11px;font-family:var(--fd);font-size:.65rem;font-weight:700;
  letter-spacing:.07em;color:var(--blue-bright);text-transform:uppercase}
.chot{position:absolute;bottom:.9rem;left:.9rem;
  display:flex;align-items:center;gap:5px;
  background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:40px;padding:4px 11px;
  font-family:var(--fd);font-size:.67rem;font-weight:700;color:#fff;
  animation:pbadge 2s ease-in-out infinite}
@keyframes pbadge{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 7px rgba(245,158,11,0)}}

/* CARD BODY */
.cbody{padding:1.3rem;flex:1;display:flex;flex-direction:column;gap:.5rem}
.cico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:.95rem;flex-shrink:0}
.ctop{display:flex;align-items:center;gap:.7rem}
.ctitle{font-family:var(--fd);font-size:1.05rem;font-weight:800;color:var(--text);line-height:1.2}
.cdesc{color:var(--muted);font-size:.83rem;line-height:1.58;flex:1}
.cfeats{display:flex;flex-wrap:wrap;gap:5px}
.cft{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.18);
  border-radius:40px;padding:2px 9px;font-size:.67rem;font-weight:600;color:var(--blue-bright)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:auto;padding-top:.3rem}
.ctrial{font-size:.72rem;color:var(--green);font-weight:600;display:flex;align-items:center;gap:4px}
.ccta{background:linear-gradient(135deg,var(--blue),#5b21b6);color:#fff;border:none;
  padding:.65rem 1.3rem;border-radius:50px;font-family:var(--fd);font-size:.8rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .3s;
  box-shadow:0 4px 18px rgba(59,130,246,.22);white-space:nowrap;flex-shrink:0}
.ccta:hover{transform:scale(1.06);box-shadow:0 8px 28px rgba(59,130,246,.4)}
.ccta.gold{background:linear-gradient(135deg,var(--accent),#d97706);box-shadow:0 4px 18px rgba(245,158,11,.22)}
.ccta.gold:hover{box-shadow:0 8px 28px rgba(245,158,11,.4)}

/* CUSTOM CARD — full width horizontal */
.pcard.custom{grid-column:1/-1;flex-direction:row;align-items:stretch;border-color:rgba(245,158,11,.3);
  background:linear-gradient(135deg,var(--surface),rgba(245,158,11,.03))}
.pcard.custom:hover{border-color:rgba(245,158,11,.6);
  box-shadow:0 28px 55px rgba(0,0,0,.4),0 0 40px rgba(245,158,11,.12)}
.pcard.custom .cmedia{width:340px;flex-shrink:0;aspect-ratio:unset;border-radius:0}
.pcard.custom .cbody{justify-content:center;padding:2rem 2.5rem}
.pcard.custom .ctitle{font-size:1.6rem}
.pcard.custom .cdesc{font-size:.93rem;max-width:600px}
.pcard.custom .cfeats{margin-bottom:1rem}

/* MODAL */
.modal-ov{position:fixed;inset:0;z-index:2000;background:rgba(4,8,15,.93);
  backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;
  padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-ov.open{opacity:1;pointer-events:all}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:26px;
  width:100%;max-width:960px;max-height:90vh;overflow-y:auto;
  transform:translateY(28px) scale(.97);
  transition:transform .4s cubic-bezier(.175,.885,.32,1.275);
  scrollbar-width:thin;scrollbar-color:var(--blue) transparent}
.modal-ov.open .mbox{transform:translateY(0) scale(1)}
.mcl{position:sticky;top:1rem;z-index:10;float:right;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--border);
  background:rgba(4,8,15,.9);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;font-size:.9rem;margin:1rem 1rem -2rem auto}
.mcl:hover{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.4)}

/* GALLERY */
.mgal{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;margin:1.4rem 1.4rem 0}
.gslides{display:flex;transition:transform .4s ease;height:100%}
.gslide{min-width:100%;height:100%}
.gslide img{width:100%;height:100%;object-fit:cover;display:block}
.gslide iframe{width:100%;height:100%;border:none;display:block}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border-radius:50%;background:rgba(4,8,15,.8);backdrop-filter:blur(8px);
  border:1px solid var(--border);color:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer;transition:all .2s;font-size:.85rem}
.gnav:hover{background:var(--blue);border-color:var(--blue)}
.gnav.prev{left:.8rem}.gnav.next{right:.8rem}
.gdots{position:absolute;bottom:.8rem;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.gdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.gdot.active{background:#fff;transform:scale(1.3)}
.gtabs{display:flex;gap:7px;padding:.7rem 1.4rem 0}
.gtab{padding:5px 15px;border-radius:40px;border:1px solid var(--border);
  font-family:var(--fd);font-size:.73rem;font-weight:700;cursor:pointer;
  transition:all .25s;color:var(--muted);background:transparent}
.gtab.active{background:var(--blue);border-color:var(--blue);color:#fff}

/* MODAL CONTENT */
.mc{padding:1.4rem}
.mtitle{font-family:var(--fd);font-size:1.7rem;font-weight:800;margin-bottom:.35rem}
.mcat{color:var(--blue-bright);font-size:.83rem;font-weight:600;margin-bottom:1.1rem}
.mdesc{color:#9db4cc;font-size:.95rem;line-height:1.75;margin-bottom:1.4rem}
.mfeats{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:.7rem;margin-bottom:1.4rem}
.mfeat{background:var(--surface2);border:1px solid var(--border);border-radius:11px;
  padding:.75rem .9rem;display:flex;align-items:flex-start;gap:9px}
.mfi{color:var(--green);font-size:.82rem;margin-top:2px;flex-shrink:0}
.mft{font-size:.83rem;color:var(--text);line-height:1.4}

/* DEAL IN MODAL */
.mdeal{background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(239,68,68,.05));
  border:1px solid rgba(245,158,11,.35);border-radius:15px;padding:1.4rem;
  margin-bottom:1.4rem;position:relative;overflow:hidden}
.mdeal::before{content:'';position:absolute;inset:0;
  background:conic-gradient(from 0deg,transparent 70%,rgba(245,158,11,.07) 80%,transparent 90%);
  animation:rconic 8s linear infinite;pointer-events:none}
@keyframes rconic{to{transform:rotate(360deg)}}
.dh{font-family:var(--fd);font-size:1rem;font-weight:800;color:var(--accent);
  margin-bottom:.5rem;position:relative;z-index:1;display:flex;align-items:center;gap:7px}
.db{color:#d4a84b;font-size:.9rem;line-height:1.65;position:relative;z-index:1}

/* CONTACT CHOICE */
.cct{font-family:var(--fd);font-size:.95rem;font-weight:700;text-align:center;margin-bottom:.9rem}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.cbtn{display:flex;align-items:center;gap:11px;padding:.9rem 1.1rem;border-radius:13px;
  border:1px solid var(--border);text-decoration:none;background:var(--surface2);
  color:var(--text);transition:all .3s;cursor:pointer}
.cbtn:hover{transform:translateY(-3px)}
.cbtn.tg:hover{background:rgba(42,171,238,.1);border-color:#2AABEE;box-shadow:0 8px 22px rgba(42,171,238,.15)}
.cbtn.wa:hover{background:rgba(37,211,102,.1);border-color:#25D366;box-shadow:0 8px 22px rgba(37,211,102,.15)}
.cbtn.em:hover{background:rgba(59,130,246,.1);border-color:var(--blue);box-shadow:0 8px 22px rgba(59,130,246,.15)}
.cbtn.li:hover{background:rgba(10,102,194,.1);border-color:#0A66C2;box-shadow:0 8px 22px rgba(10,102,194,.15)}
.cbico{font-size:1.4rem;flex-shrink:0}
.cbtn.tg .cbico{color:#2AABEE}.cbtn.wa .cbico{color:#25D366}
.cbtn.em .cbico{color:var(--blue-bright)}.cbtn.li .cbico{color:#60a5fa}
.cbinfo h5{font-family:var(--fd);font-size:.85rem;font-weight:700}
.cbinfo span{font-size:.72rem;color:var(--muted)}

/* LIGHTBOX */












/* AI IMPACT SECTION */
.impact-s{padding:5rem 0}
.impact-intro{text-align:center;max-width:720px;margin:0 auto 4rem}
.impact-lead{font-size:clamp(1.1rem,2.5vw,1.35rem);color:#9db4cc;line-height:1.75;margin-top:1rem}
.impact-lead strong{color:var(--text)}

.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-bottom:4rem}
@media(max-width:900px){.why-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.why-grid{grid-template-columns:1fr}}

.why-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:2rem 1.8rem;position:relative;overflow:hidden;
  transition:transform .3s,box-shadow .3s,border-color .3s}
.why-card:hover{transform:translateY(-6px);border-color:rgba(99,179,255,.35);
  box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 30px rgba(59,130,246,.08)}

.contact-s{padding:3.5rem 0 3rem}

.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);

.ccard.tg::before{background:#2AABEE}.ccard.wa::before{background:#25D366}

.ccico{font-size:2.1rem}

.d1{transition-delay:.1s}.d2{transition-delay:.2s}.d3{transition-delay:.3s}
.d4{transition-delay:.4s}.d5{transition-delay:.5s}.d6{transition-delay:.6s}

/* ─── AI CHAT WIDGET ─── */
.ai-bubble{position:fixed;bottom:28px;right:28px;z-index:3000;
  width:62px;height:62px;cursor:pointer;border:none;background:none;padding:0}
.ai-ring{position:absolute;border-radius:50%;border:2px solid rgba(59,130,246,.45);
  animation:aring 2.4s ease-out infinite}
.ai-ring.r1{inset:-7px;animation-delay:0s}
.ai-ring.r2{inset:-15px;animation-delay:.6s}
.ai-ring.r3{inset:-23px;animation-delay:1.2s}
@keyframes aring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.ai-inner{position:absolute;inset:0;border-radius:50%;

  box-shadow:0 8px 28px rgba(59,130,246,.5);transition:transform .3s}
.ai-bubble:hover .ai-inner{transform:scale(1.1) rotate(-10deg)}
.ai-tip{position:absolute;bottom:70px;right:0;background:var(--surface);

@keyframes tipbounce{0%{opacity:0;transform:translateY(5px)}15%{opacity:1;transform:translateY(0)}85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(5px)}}

/* CHAT PANEL */
.chat-panel{position:fixed;bottom:108px;right:16px;z-index:3000;

.chat-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all}
.ch-head{background:linear-gradient(135deg,#1e3a5f,#2d1b69);

.ch-info{display:flex;align-items:center;gap:.75rem}
.ch-av{width:38px;height:38px;border-radius:50%;

.ch-name{font-family:var(--fd);font-size:.9rem;font-weight:700;color:#fff}
.ch-st{display:flex;align-items:center;gap:5px;font-size:.72rem;color:rgba(255,255,255,.65);margin-top:1px}
.stdt{width:6px;height:6px;border-radius:50%;background:#10b981;animation:stpulse 2s ease-in-out infinite}
@keyframes stpulse{0%,100%{opacity:1}50%{opacity:.4}}
.ch-close{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);

  transition:all .2s;font-size:.8rem}
.ch-close:hover{background:rgba(255,255,255,.18);color:#fff}
.ch-msgs{flex:1;overflow-y:auto;padding:.9rem 1rem;display:flex;flex-direction:column;gap:.7rem;
  scrollbar-width:thin;scrollbar-color:rgba(59,130,246,.3) transparent}
.msg{display:flex;gap:.5rem;align-items:flex-end;max-width:90%}
.msg.ai{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;

.msg-bub{padding:.65rem .9rem;border-radius:14px;font-size:.83rem;line-height:1.55;max-width:100%}
.msg.ai .msg-bub{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.2);color:var(--text);border-bottom-left-radius:4px}
.msg.user .msg-bub{background:linear-gradient(135deg,var(--blue),#5b21b6);color:#fff;border-bottom-right-radius:4px}
.msg-typing{display:flex;gap:4px;align-items:center;padding:.65rem .9rem;
  background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.2);border-radius:14px;border-bottom-left-radius:4px}
.td{width:6px;height:6px;border-radius:50%;background:var(--blue-bright);animation:tdot 1.2s ease-in-out infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.ch-foot{padding:.75rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:.55rem;flex-shrink:0}
.ch-inp-row{display:flex;gap:.5rem;align-items:center}
.ch-inp{flex:1;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);
  border-radius:12px;padding:.6rem .9rem;font-size:.83rem;color:var(--text);
  font-family:var(--fb);outline:none;transition:border-color .2s}
.ch-inp:focus{border-color:var(--blue)}
.ch-inp::placeholder{color:var(--muted);font-size:.8rem}
.ch-send{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;font-size:.85rem;flex-shrink:0}
.ch-send:hover{transform:scale(1.1)}
.ch-save{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:var(--green);
  border-radius:10px;padding:.5rem .9rem;font-size:.77rem;font-weight:600;

.ch-save:hover{background:rgba(16,185,129,.2);border-color:var(--green)}
.ch-save.sent{color:#60a5fa;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.1)}

@media(max-width:1024px){

// ── COUNTERS ──
function animC(id,target,suf,dur){
  const el=document.getElementById(id); if(!el) return;
  const s=performance.now();
  (function step(n){
    const p=Math.min((n-s)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent=Math.floor(e*target)+suf;
    if(p<1) requestAnimationFrame(step);
  })(s);
}
const sbObs=new IntersectionObserver(en=>{
  if(en[0].isIntersecting){animC('c40',40,'+',1800);animC('c2k',14,'',1000);animC('c80',80,'%',1600);sbObs.disconnect();}
},{threshold:.5});

const cvs=document.getElementById('cvs'),ctx=cvs.getContext('2d');
let W,H,pts=[];
function resize(){W=cvs.width=window.innerWidth;H=cvs.height=window.innerHeight;}
resize(); window.addEventListener('resize',resize);
class P{
  constructor(){this.rs();}
  rs(){this.x=Math.random()*W;this.y=Math.random()*H;this.r=Math.random()*1.3+.3;
    this.vx=(Math.random()-.5)*.35;this.vy=(Math.random()-.5)*.35;this.a=Math.random()*.5+.1;}
  u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>W||this.y<0||this.y>H)this.rs();}
  d(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(96,165,250,${this.a})`;ctx.fill();}
}
for(let i=0;i<130;i++)pts.push(new P());
function conn(){
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<110){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
      ctx.strokeStyle=`rgba(59,130,246,${.07*(1-d/110)})`;ctx.lineWidth=.5;ctx.stroke();}
  }
}
(function loop(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.u();p.d();});conn();requestAnimationFrame(loop);})();
